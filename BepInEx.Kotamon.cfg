[IL2CPP]

## The launcher includes interop assemblies generated for this exact KOTAMON build.
## Regeneration would replace the Unity 6 compatibility adjustment.
UpdateInteropAssemblies = false

## A local Unity 6000.4.1 archive is bundled, so no network download is required.
UnityBaseLibrariesSource = 6000.4.1.zip

IL2CPPInteropAssembliesPath = {BepInEx}
PreloadIL2CPPInteropAssemblies = true

[Logging]

## Unity 6000.4.1 generates a duplicate compiler cache type in CoreModule.
## The cheat has its own BepInEx logging and does not need Unity log forwarding.
UnityLogListening = false

[Logging.Console]

Enabled = true
